<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="fond" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#0B3A47"/>
      <stop offset="100%" stop-color="#05060F"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#fond)"/>

  <!-- Anneaux fins -->
  <g fill="none" stroke="#00E5FF" stroke-opacity="0.2" stroke-width="3">
    <circle cx="512" cy="512" r="380"/>
    <circle cx="512" cy="512" r="310"/>
    <circle cx="512" cy="512" r="240"/>
  </g>

  <!-- Arcs lumineux -->
  <g fill="none" stroke-linecap="round" stroke-width="16" filter="url(#glow)">
    <circle cx="512" cy="512" r="380" stroke="#00E5FF" stroke-dasharray="620 1768" transform="rotate(-70 512 512)"/>
    <circle cx="512" cy="512" r="310" stroke="#FF2D95" stroke-dasharray="500 1448" transform="rotate(100 512 512)"/>
    <circle cx="512" cy="512" r="240" stroke="#39FF14" stroke-dasharray="380 1128" transform="rotate(200 512 512)"/>
  </g>

  <!-- Aiguilles -->
  <g stroke="#FFFFFF" stroke-linecap="round" filter="url(#glow)">
    <line x1="512" y1="512" x2="512" y2="350" stroke-width="22"/>
    <line x1="512" y1="512" x2="640" y2="580" stroke-width="22"/>
  </g>
  <circle cx="512" cy="512" r="26" fill="#00E5FF" filter="url(#glow)"/>
</svg>